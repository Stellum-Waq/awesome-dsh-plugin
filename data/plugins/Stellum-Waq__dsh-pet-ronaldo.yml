url: https://github.com/Stellum-Waq/dsh-pet-ronaldo
name: Stellum-Waq/dsh-pet-ronaldo
category: fun
description:
  en: 'Cristiano Ronaldo desktop pet for DeepSeek Harness: a chibi Portugal number 7 mascot in a bottom-right overlay whose animation follows the agent state — dribbling while tools run, thinking during a turn, waiting at approvals, diving on errors — and jumping in a SIU celebration with a host-process sound when a turn completes; it can be dragged, looks at the cursor on hover, dives on a triple click, and a settings panel manages several pets and imports custom spritesheets. Since v2 it also runs as a borderless, always-on-top native Windows window that keeps living after the browser is closed: hovering shows the current workspace and conversation title, double-clicking opens the Harness page in Edge, and dragging, mouse-wheel resizing and a right-click menu work there too, sharing position, size and behaviour with the web panel. Pet sheets may use any cell resolution and scale preserving aspect ratio (atlas.scaling: smooth | pixelated).'
  zh: 'DSH 桌宠：Web 界面右下角的 C 罗精灵，动画随 Agent 状态切换——工具执行中颠球、回合中思考、等待审批、出错假摔——回合完成时跳起 SIU 庆祝并由宿主进程播放提示音；支持拖动、悬停注视光标、连点三次假摔，设置面板可管理多只宠物并导入自定义 spritesheet。v2 起同时提供一个无边框、始终置顶的原生 Windows 窗口，关掉浏览器也还在：悬停显示当前工作区与对话名，双击用 Edge 打开 Harness 页面，拖动、滚轮改大小、右键菜单都可用，位置/大小/行为与网页设置面板共用同一份状态。素材单格分辨率不限、等比缩放（atlas.scaling: smooth | pixelated）。'
